# ==============================================================================
# tmux 配置
# 使用场景：macOS（Ghostty / kitty）通过 SSH 连接局域网 Ubuntu，并使用 tmux 保持会话
# 剪贴板原理：文字通过 OSC 52 转义序列在 tmux 与 macOS 之间双向传递；
#             图片无法走 OSC 52，需另建反向通道（mac 端 pngpaste + ssh 回连）
# ==============================================================================

# ------------------------------------------------------------------------------
# 一、终端类型与剪贴板
# ------------------------------------------------------------------------------

# 终端类型 default-terminal：tmux 3.5+ 默认值已是 tmux-256color，无需显式设置
# 仅当回退到旧版 tmux（< 3.5）时才需取消下一行注释
# 依赖：Ubuntu 需安装 ncurses-term（sudo apt install ncurses-term）
# 校验：infocmp tmux-256color >/dev/null && echo ok
# set -g default-terminal "tmux-256color"

# 允许程序透传转义序列
# 用途：nvim、pi 等程序可直接向终端发送 OSC 52 或图片协议，无需 tmux 代转
set -g allow-passthrough on

# 扩展按键：保留带修饰键的 Enter（Shift+Enter、Ctrl+Enter、Alt+Enter）
# 原因：tmux 3.3 起默认 off，会把修饰键 + Enter 折叠成普通 Enter，
#       导致 pi、nvim 等程序无法用 Shift+Enter 换行（变成直接发送）
# 取值为 on 而非 always：仅当程序通过 terminfo 主动请求时才启用 CSI u，
#       即使偶尔从 macOS Terminal.app（不支持 CSI u）连接也不会按键错乱
# 依赖：tmux >= 3.3（当前 3.6 满足）、外层终端支持 CSI u（Ghostty/kitty 均支持）
set -g extended-keys on

# 声明外层终端具备 extkeys（扩展键）能力
# 原因：extended-keys 只是“开关”，tmux 还需知道外层终端支不支持扩展键，
#       这个判断完全依赖 terminal-features 里的 extkeys 特性。
#       内置默认值只给了 xterm*:clipboard:ccolour:cstyle:focus:title，
#       没有 extkeys，于是 tmux 从不向 Ghostty 请求 modifyOtherKeys，
#       Shift+Enter 仍以普通 CR 上报 —— 这才是之前“配了但无效”的真正原因。
# 说明：按终端全名精确声明，避免波及不支持扩展键的其他 xterm-* 终端
# 注：terminal-features 仅在 client 建立时生效。tmux 源码里 tty_update_features()
#     只被 client 启动 / DA 应答 / 5 秒查询超时 三种时机调用，改选项不会补发，
#     因此新增此配置后必须 detach + attach 重建连接（pi 会话不受影响）。
# 验证：tmux info | grep Eneks  应显示 Eneks: (string) \033[>4;2m
# 幂等：set -as 是累加语义，反复 source-file 会重复追加，用哨兵选项保证只追加一次
%if #{!=:#{@extkeys-declared},1}
set -as terminal-features 'xterm-ghostty:extkeys'
set -as terminal-features 'xterm-kitty:extkeys'
set -g @extkeys-declared 1
%endif

# 扩展键编码格式：必须为 csi-u
# 原因：pi 启动时会额外校验此项，xterm 会告警“Pi works best with csi-u”
#       且 csi-u 能把 Shift+Enter 明确编码为 ESC [ 13 ; 2 u，与普通 Enter 彻底区分
#       原判断“保持默认 xterm 更保守”有误：pi 需要的就是 csi-u
set -g extended-keys-format csi-u

# 剪贴板：必须显式设为 on
# 原因：tmux 3.2 起默认值为 external，仅使用外部剪贴板，不会向终端发送 OSC 52；
#       改为 on 后，复制操作才会真正写入 macOS 系统剪贴板
set -g set-clipboard on

# 鼠标：开启后拖选由 tmux 接管，松开鼠标即写入 macOS 剪贴板
# 副作用：想使用终端原生选择时需按住 Shift 拖拽
set -g mouse on

# 转义序列判定延迟 escape-time：tmux 3.6 默认值已是 10ms，无需显式设置
# （历史原因：3.6 之前默认 500ms，SSH + vim/pi 下 ESC 会明显粘滞，故曾设为 10）
# set -sg escape-time 10

# 滚动缓冲行数
# 原因：默认 2000 行，长会话中无法回溯早期输出
set -g history-limit 50000

# 窗口焦点变化上报，供 nvim、pi 等程序感知失焦/聚焦
set -g focus-events on

# 复制模式键位 mode-keys：tmux 3.6 默认值已是 vi，无需显式设置
# （如需改回 emacs 键位，取消下一行注释并改为 emacs）
# setw -g mode-keys vi

# Enter 在复制模式下完成复制并退出
# 配合 set-clipboard on，该操作同时把内容写入 macOS 剪贴板
bind-key -T copy-mode    Enter send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

# ------------------------------------------------------------------------------
# 二、前缀键
# ------------------------------------------------------------------------------

# 保持 tmux 默认前缀 Ctrl+b，此处不作改动
# 说明：如需改键，取消下面两行注释并替换为所需按键即可
# set -g prefix C-a
# bind C-a send-prefix

# 无需前缀：Ctrl+z 切换当前窗格最大化
bind-key -n C-z resize-pane -Z

# ------------------------------------------------------------------------------
# 二·五、窗格切换：hjkl
# ------------------------------------------------------------------------------

# 用 vim 方向键切窗格，替代默认的 prefix + 方向键（方向键绑定仍保留，两者并存）
# -r：连按同一个键时无需重复按前缀，可连续跳转多个窗格（与默认方向键行为一致）
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# l 原本默认绑定 last-window，已被上面的 select-pane 覆盖，故挪到 Tab
# 若不常用“回到上一个窗口”，删掉本行即可，不影响 hjkl
bind-key Tab last-window

# ------------------------------------------------------------------------------
# 三、窗格布局：左侧主窗格 + 右侧堆叠
# ------------------------------------------------------------------------------

# 任意窗格拆分后，自动重排为 main-vertical 布局
set-hook -g after-split-window "select-layout main-vertical"

# 主窗格默认宽度
# 与日志看板（j-window / j-pane）保持一致：26%（≈ 55 列 ≈ 26 个汉字），
# 这样普通窗口和日志窗口的左侧栏宽度看起来是齐的。
set -g main-pane-width 26%

# Ctrl+b 再按 Enter：在当前工作目录竖向拆分窗格
# 拆分后的位置由上面的 after-split-window 钩子决定
bind Enter split-window -v -c "#{pane_current_path}"

# Ctrl+b 再按 =：主窗格收窄到 26%（与默认宽度相同），并聚焦右侧顶部窗格
bind = set-option -w main-pane-width 26% \; select-layout main-vertical \; select-pane -t '{top-right}'

# Ctrl+b 再按 -：主窗格放宽到 80%，并聚焦主窗格
bind - set-option -w main-pane-width 80% \; select-layout main-vertical \; select-pane -t '{top-left}'

# ------------------------------------------------------------------------------
# 四、图片路径快捷插入
# ------------------------------------------------------------------------------

# Ctrl+b 再按 v：插入最新一张图片的路径（文件名为同步时间戳）
# 场景：在 pi 提示符下按此键，路径直接出现在输入框，回车即让 AI 读图
# 说明：路径唯一且不会被覆盖，因此同一对话中可先后引用多张不同的图
bind-key v run-shell -b "~/.local/bin/clip-path 1"

# Ctrl+b 再按 V：插入第 2 新的图片，用于补引用上一张
bind-key V run-shell -b "~/.local/bin/clip-path 2"

# Ctrl+b 再按 y：在弹窗里用 fzf 挑选任意一张未过期图片（可看字符画预览）
bind-key y display-popup -E -w 80% -h 70% "CLIP_TARGET=#{pane_id} ~/.local/bin/clip-pick"

# 说明：曾尝试用 Kitty 图形协议在弹窗/独立窗口中显示高清真图（clip-show + tmux-image），
#       实测 Ghostty + tmux 下 DCS 透传未生效，只有字符画能显示，故移除相关绑定。
#       高清看图的可行方式：Ctrl+b v 取路径后用 yazi 打开，或 yazi ~/.clip/inbox。
#       脚本 ~/.local/bin/clip-show 与 tmux-image 保留备查，未绑定按键。

# 可选：如果不想按前缀，取消下面一行注释即可用 Alt+i 直接插入
# （注意 Alt 组合键可能与某些程序自身快捷键冲突）
# bind-key -n M-i run-shell -b "~/.local/bin/clip-path"

# ------------------------------------------------------------------------------
# 六、个人日志看板（j / j-board）
# ------------------------------------------------------------------------------
# 数据在 ~/journal（一天一个 markdown 文件），看板只读、不接收输入（q 退出）。
# 录入全部走全局 popup，任何窗口都能用，不需要先切到日志窗口。
# 看板宽度调整：Ctrl+b 再按 = / -（已改为只作用于当前窗口，不影响其他窗口）

# 键位总览（都在 prefix 之后）
#   Space  记一笔速记（主入口，原 next-layout 让位）；+ 开头 = 直接进 todolist
#   L      浏览/搜索全部速记（fzf，回车用 nvim 打开那天）
#   a      临时起一个 pi 把话变成记录（用完即退，不是常驻）
#   S      生成今日总结（一天可多次）
#   W      生成本周周报
#   M      生成本月月报
#   e      直接编辑今天的 markdown
#   Y      yazi 弹窗（取代被看板占掉的左栏）
#   J      新建/跳转日志窗口（左侧 26% 看板 + 右侧工作区）
#   B      在当前窗口左侧召唤/收起看板（不动其他 pane，再按一次收起）
#   X      管理 todo：回车切换完成 / C-R 改名 / C-D 删除 / C-P 从计划外衍生待办
#   R      开工视图（上次没做完的 + 今天现状）
#   ?      快捷键速查（就地在弹窗里列出这一页）

# 日志窗口：跳过去并保证左边有看板（26% ≈ 55 列 ≈ 26 个汉字）
bind-key J run-shell '$HOME/.local/bin/j-window'

# 记一笔（主入口）
bind-key Space display-popup -E -w 70% -h 5 -T " 记一笔 " '$HOME/.local/bin/j-capture'

# 在当前窗口左侧召唤 / 收起看板（不杀掉任何已有 pane）
bind-key B run-shell '$HOME/.local/bin/j-pane #{window_id}'

# 快捷键速查（覆盖 tmux 默认的 list-keys）
bind-key ? display-popup -E -w 80% -h 90% -T " 快捷键 " '$HOME/tmux-config/bin/tmux-keys'

# 开工视图：上次没做完的、上次定的明日计划、今天的现状
bind-key R display-popup -E -w 80% -h 70% -T " 开工 " '$HOME/.local/bin/j-start'

# 管理 todo（状态 / 改名 / 删除 / 衍生）
bind-key X display-popup -E -w 70% -h 60% -T " 今日计划 " '$HOME/.local/bin/j-toggle'

# 浏览速记：fzf 搜索，右侧预览当天，回车用 nvim 打开
bind-key L display-popup -E -w 92% -h 88% -T " 速记 " '$HOME/.local/bin/j-browse'

# 日志助手：一次性 pi 会话，聊完落盘即退
bind-key a display-popup -E -w 92% -h 86% -T " 日志助手 " '$HOME/.local/bin/j-chat'

# 今日总结 / 周报 / 月报
bind-key S display-popup -E -w 88% -h 82% -T " 今日总结 " '$HOME/.local/bin/j-report-ui'
bind-key W display-popup -E -w 88% -h 82% -T " 周报 " '$HOME/.local/bin/j-week-ui'
bind-key M display-popup -E -w 88% -h 82% -T " 月报 " '$HOME/.local/bin/j-month-ui'

# 直接编辑今日文件
bind-key e display-popup -E -w 92% -h 88% -T " 今日日志 " '/usr/bin/nvim $($HOME/.local/bin/j path)'

# yazi 兜底
bind-key Y display-popup -E -w 90% -h 90% -T " yazi " '/usr/bin/yazi'
